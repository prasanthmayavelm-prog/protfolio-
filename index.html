<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Cards Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --indigo-50: #eef2ff;
  --indigo-100: #e0e7ff;
  --indigo-500: #6366f1;
  --indigo-600: #4f46e5;
  --indigo-700: #4338ca;
  --violet-100: #ede9fe;
  --violet-500: #8b5cf6;
  --violet-700: #6d28d9;
  --green-100: #dcfce7;
  --green-500: #22c55e;
  --green-600: #16a34a;
  --red-500: #ef4444;
  --red-50: #fef2f2;

  --bg: #f5f6fb;
  --white: #ffffff;
  --gray-900: #111827;
  --gray-700: #374151;
  --gray-500: #6b7280;
  --gray-400: #9ca3af;
  --gray-200: #e5e7eb;
  --gray-100: #f3f4f6;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 10px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 12px 28px rgba(16, 24, 40, 0.12);

  --radius-lg: 16px;
  --radius-xl: 20px;

  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--gray-900);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#root {
  min-height: 100vh;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input,
textarea {
  font-family: inherit;
}

::selection {
  background: var(--indigo-100);
  color: var(--indigo-700);
}

:focus-visible {
  outline: 2px solid var(--indigo-500);
  outline-offset: 2px;
}
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  box-shadow: var(--shadow-sm);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.app-header__brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.app-header__logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--indigo-600);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.app-header__titles h1 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--gray-900);
}

.app-header__titles p {
  margin: 2px 0 0;
  font-size: 0.82rem;
  color: var(--gray-500);
}

.app-header__right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 500;
  white-space: nowrap;
}

.badge strong {
  font-weight: 700;
}

.badge--indigo {
  background: var(--indigo-50);
  color: var(--indigo-700);
}

.badge--violet {
  background: var(--violet-100);
  color: var(--violet-700);
}

.app-header__toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--indigo-600);
  color: var(--white);
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s ease, transform 0.1s ease;
}

.app-header__toggle:hover {
  background: var(--indigo-700);
}

.app-header__toggle:active {
  transform: scale(0.97);
}

/* ---------- Main layout ---------- */
.app-main {
  flex: 1;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 32px 64px;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 28px;
  align-items: start;
}

.app-main--full {
  grid-template-columns: 1fr;
}

@media (max-width: 900px) {
  .app-main {
    grid-template-columns: 1fr;
  }
}

/* ---------- Footer ---------- */
.app-footer {
  text-align: center;
  padding: 20px;
  font-size: 0.8rem;
  color: var(--gray-400);
  border-top: 1px solid var(--gray-200);
  background: var(--white);
}

.app-footer code {
  background: var(--gray-100);
  color: var(--gray-700);
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 0.76rem;
}
.form-panel {
  position: sticky;
  top: 96px;
  background: var(--white);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.form-panel__header {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 4px;
}

.form-panel__icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--indigo-50);
  color: var(--indigo-600);
  display: flex;
  align-items: center;
  justify-content: center;
}

.form-panel__titles h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--gray-900);
}

.form-panel__titles p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--gray-500);
}

.form-panel__demo-btn {
  grid-column: 1 / -1;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--indigo-50);
  color: var(--indigo-600);
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 0.78rem;
  font-weight: 600;
}

.form-panel__demo-btn:hover {
  background: var(--indigo-100);
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-field label {
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--gray-700);
}

.required-star {
  color: var(--red-500);
}

.optional-tag {
  color: var(--gray-400);
  font-weight: 400;
}

.form-field input,
.form-field textarea {
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.9rem;
  color: var(--gray-900);
  resize: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-field input:focus,
.form-field textarea:focus {
  border-color: var(--indigo-500);
  outline: none;
  box-shadow: 0 0 0 3px var(--indigo-100);
}

.form-field input::placeholder,
.form-field textarea::placeholder {
  color: var(--gray-400);
}

.form-field__hint {
  font-size: 0.74rem;
  color: var(--gray-400);
}

.form-error {
  margin: 0;
  background: var(--red-50);
  color: var(--red-500);
  font-size: 0.82rem;
  padding: 8px 12px;
  border-radius: 8px;
}

.form-submit {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--indigo-600);
  color: var(--white);
  border: none;
  padding: 22px 16px;
  border-radius: var(--radius-lg);
  font-size: 0.95rem;
  font-weight: 700;
  box-shadow: var(--shadow-md);
  transition: background 0.15s ease, transform 0.1s ease;
}

.form-submit:hover {
  background: var(--indigo-700);
}

.form-submit:active {
  transform: scale(0.98);
}
.contact-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.contact-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}

.contact-card__bar {
  height: 5px;
  width: 100%;
}

.bar--blue {
  background: linear-gradient(90deg, #3b82f6, #06b6d4);
}

.bar--green {
  background: linear-gradient(90deg, #10b981, #14b8a6);
}

.bar--violet {
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
}

.contact-card__body {
  padding: 20px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.contact-card__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.contact-card__avatar-wrap {
  position: relative;
  width: 56px;
  height: 56px;
}

.contact-card__avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
}

.contact-card__avatar--fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--indigo-100);
  color: var(--indigo-700);
  font-weight: 700;
  font-size: 1.05rem;
}

.contact-card__status-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--green-500);
  border: 2px solid var(--white);
}

.contact-card__delete {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--gray-400);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;
}

.contact-card__delete:hover {
  background: var(--red-50);
  color: var(--red-500);
}

.contact-card__name {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--gray-900);
}

.contact-card__tags {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 999px;
}

.tag--title {
  background: var(--indigo-50);
  color: var(--indigo-700);
}

.tag--company {
  background: var(--violet-100);
  color: var(--violet-700);
}

.contact-card__bio {
  margin: 0;
  font-size: 0.86rem;
  color: var(--gray-500);
  line-height: 1.5;
}

.contact-card__contact {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--gray-100);
}

.contact-card__row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  color: var(--gray-700);
  text-decoration: none;
}

.contact-card__row:hover {
  color: var(--indigo-600);
}

.contact-card__icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.contact-card__icon--mail {
  background: var(--indigo-50);
  color: var(--indigo-600);
}

.contact-card__icon--phone {
  background: var(--green-100);
  color: var(--green-600);
}
.directory__header h2 {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 800;
  color: var(--gray-900);
}

.directory__header p {
  margin: 4px 0 0;
  font-size: 0.9rem;
  color: var(--gray-500);
}

.directory__search-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 20px 0 24px;
}

.directory__search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: var(--shadow-sm);
}

.directory__search:focus-within {
  border-color: var(--indigo-500);
  box-shadow: 0 0 0 3px var(--indigo-100);
}

.directory__search svg {
  color: var(--gray-400);
  flex-shrink: 0;
}

.directory__search input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 0.9rem;
  color: var(--gray-900);
  width: 100%;
}

.directory__search input::placeholder {
  color: var(--gray-400);
}

.directory__count {
  font-size: 0.85rem;
  color: var(--gray-500);
  white-space: nowrap;
}

.directory__count strong {
  color: var(--gray-900);
}

.contact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
}

.directory__empty {
  border: 1.5px dashed var(--gray-200);
  border-radius: var(--radius-lg);
  padding: 56px 24px;
  text-align: center;
  color: var(--gray-500);
  background: var(--white);
}

.directory__empty p {
  margin: 0;
  font-size: 0.95rem;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;


const EMPTY_FORM = {
  fullName: "",
  email: "",
  title: "",
  company: "",
  phone: "",
  avatarUrl: "",
  bio: "",
};

const DEMO_PROFILES = [
  {
    fullName: "Maya Lin",
    email: "maya.lin@company.com",
    title: "Product Manager",
    company: "Acme Corp",
    phone: "+1 (555) 019-2288",
    avatarUrl: "https://i.pravatar.cc/150?img=5",
    bio: "Leads discovery for the payments team and loves a good spreadsheet.",
  },
  {
    fullName: "Noah Whitfield",
    email: "noah@brightloop.io",
    title: "Backend Engineer",
    company: "BrightLoop",
    phone: "+1 (555) 402-7731",
    avatarUrl: "https://i.pravatar.cc/150?img=15",
    bio: "Distributed systems and databases person. Coffee before code.",
  },
  {
    fullName: "Ines Faria",
    email: "ines.faria@studiofaria.com",
    title: "Brand Strategist",
    company: "Studio Faria",
    phone: "+1 (555) 660-4410",
    avatarUrl: "https://i.pravatar.cc/150?img=25",
    bio: "Helps early-stage founders find a voice that doesn't sound like everyone else.",
  },
];

function SparkleIcon() {
  return (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
      <path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8L12 2z" />
    </svg>
  );
}

function PlusTileIcon() {
  return (
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" />
    </svg>
  );
}

function ContactForm({ onAddContact }) {
  const [form, setForm] = useState(EMPTY_FORM);
  const [error, setError] = useState("");

  const handleChange = (field) => (event) => {
    setForm((prev) => ({ ...prev, [field]: event.target.value }));
  };

  const handleFillDemo = () => {
    const demo = DEMO_PROFILES[Math.floor(Math.random() * DEMO_PROFILES.length)];
    setForm(demo);
    setError("");
  };

  const handleSubmit = (event) => {
    event.preventDefault();

    if (!form.fullName.trim() || !form.email.trim() || !form.title.trim()) {
      setError("Full name, email, and job title are required.");
      return;
    }

    onAddContact({
      ...form,
      fullName: form.fullName.trim(),
      email: form.email.trim(),
      title: form.title.trim(),
      company: form.company.trim(),
      phone: form.phone.trim(),
      avatarUrl: form.avatarUrl.trim(),
      bio: form.bio.trim(),
    });

    setForm(EMPTY_FORM);
    setError("");
  };

  return (
    <form className="form-panel" onSubmit={handleSubmit}>
      <div className="form-panel__header">
        <div className="form-panel__icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" strokeWidth="1.8" />
            <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
          </svg>
        </div>
        <div className="form-panel__titles">
          <h2>Add New Contact</h2>
          <p>Create a new digital business card</p>
        </div>
        <button type="button" className="form-panel__demo-btn" onClick={handleFillDemo}>
          <SparkleIcon /> Fill Demo Data
        </button>
      </div>

      <div className="form-field">
        <label htmlFor="fullName">Full Name <span className="required-star">*</span></label>
        <input id="fullName" type="text" placeholder="e.g. Maya Lin" value={form.fullName} onChange={handleChange("fullName")} />
      </div>

      <div className="form-field">
        <label htmlFor="email">Email Address <span className="required-star">*</span></label>
        <input id="email" type="email" placeholder="maya.lin@company.com" value={form.email} onChange={handleChange("email")} />
      </div>

      <div className="form-field">
        <label htmlFor="title">Job Title <span className="required-star">*</span></label>
        <input id="title" type="text" placeholder="e.g. Product Designer" value={form.title} onChange={handleChange("title")} />
      </div>

      <div className="form-field">
        <label htmlFor="company">Company</label>
        <input id="company" type="text" placeholder="e.g. Acme Corp" value={form.company} onChange={handleChange("company")} />
      </div>

      <div className="form-field">
        <label htmlFor="phone">Phone Number</label>
        <input id="phone" type="tel" placeholder="+1 (555) 000-0000" value={form.phone} onChange={handleChange("phone")} />
      </div>

      <div className="form-field">
        <label htmlFor="avatarUrl">Avatar Image URL <span className="optional-tag">(optional)</span></label>
        <input id="avatarUrl" type="url" placeholder="https://example.com/avatar.jpg" value={form.avatarUrl} onChange={handleChange("avatarUrl")} />
        <span className="form-field__hint">Leave blank to auto-generate a monogram avatar</span>
      </div>

      <div className="form-field">
        <label htmlFor="bio">Short Bio / Description <span className="optional-tag">(optional)</span></label>
        <textarea id="bio" rows={3} placeholder="A brief sentence or two summarizing roles, interests, or background..." value={form.bio} onChange={handleChange("bio")} />
      </div>

      {error && <p className="form-error">{error}</p>}

      <button type="submit" className="form-submit">
        <PlusTileIcon />
        <span>Add Contact Card</span>
      </button>
    </form>
  );
}


const BAR_VARIANTS = ["bar--blue", "bar--green", "bar--violet"];

function getInitials(fullName) {
  const parts = fullName.trim().split(/\s+/);
  const initials = parts.slice(0, 2).map((part) => part[0]?.toUpperCase());
  return initials.join("") || "?";
}

function TrashIcon() {
  return (
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
      <path
        d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0-.8 12.1a2 2 0 01-2 1.9H8.8a2 2 0 01-2-1.9L6 7h12z"
        stroke="currentColor"
        strokeWidth="1.6"
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </svg>
  );
}

function BriefcaseIcon() {
  return (
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
      <rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" strokeWidth="1.6" />
      <path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" strokeWidth="1.6" />
    </svg>
  );
}

function BuildingIcon() {
  return (
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
      <rect x="4" y="3" width="16" height="18" rx="1.5" stroke="currentColor" strokeWidth="1.6" />
      <path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
    </svg>
  );
}

function MailIcon() {
  return (
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
      <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" strokeWidth="1.6" />
      <path d="M3 7l9 6 9-6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

function PhoneIcon() {
  return (
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
      <path
        d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.3 21 3 13.7 3 4.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
        stroke="currentColor"
        strokeWidth="1.4"
        strokeLinejoin="round"
      />
    </svg>
  );
}

function ContactCard({ contact, index, onRemove }) {
  const { fullName, title, company, phone, email, bio, avatarUrl } = contact;
  const barVariant = BAR_VARIANTS[index % BAR_VARIANTS.length];

  return (
    <article className="contact-card">
      <div className={`contact-card__bar ${barVariant}`} />

      <div className="contact-card__body">
        <div className="contact-card__top">
          <div className="contact-card__avatar-wrap">
            {avatarUrl ? (
              <img className="contact-card__avatar" src={avatarUrl} alt={fullName} />
            ) : (
              <div className="contact-card__avatar contact-card__avatar--fallback">
                {getInitials(fullName)}
              </div>
            )}
            <span className="contact-card__status-dot" />
          </div>

          <button
            type="button"
            className="contact-card__delete"
            onClick={() => onRemove(contact.id)}
            aria-label={`Remove ${fullName}`}
            title="Remove card"
          >
            <TrashIcon />
          </button>
        </div>

        <h3 className="contact-card__name">{fullName}</h3>

        <div className="contact-card__tags">
          {title && (
            <span className="tag tag--title">
              <BriefcaseIcon /> {title}
            </span>
          )}
          {company && (
            <span className="tag tag--company">
              <BuildingIcon /> {company}
            </span>
          )}
        </div>

        {bio && <p className="contact-card__bio">{bio}</p>}

        {(phone || email) && (
          <div className="contact-card__contact">
            {email && (
              <a className="contact-card__row" href={`mailto:${email}`}>
                <span className="contact-card__icon contact-card__icon--mail"><MailIcon /></span>
                {email}
              </a>
            )}
            {phone && (
              <a className="contact-card__row" href={`tel:${phone}`}>
                <span className="contact-card__icon contact-card__icon--phone"><PhoneIcon /></span>
                {phone}
              </a>
            )}
          </div>
        )}
      </div>
    </article>
  );
}


function SearchIcon() {
  return (
    <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
      <circle cx="8.5" cy="8.5" r="6" stroke="currentColor" strokeWidth="1.6" />
      <line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

function ContactList({
  contacts,
  totalCount,
  searchTerm,
  onSearchChange,
  onRemoveContact,
}) {
  const isFiltering = searchTerm.trim().length > 0;

  return (
    <section className="directory">
      <div className="directory__header">
        <h2>Directory</h2>
        <p>Browse, search, and manage your team and network</p>
      </div>

      <div className="directory__search-row">
        <label className="directory__search" htmlFor="contact-search">
          <SearchIcon />
          <input
            id="contact-search"
            type="text"
            placeholder="Filter by full name or company (e.g. Elena, PixelCraft)..."
            value={searchTerm}
            onChange={(event) => onSearchChange(event.target.value)}
          />
        </label>
        <span className="directory__count">
          <strong>{totalCount}</strong> contacts total
        </span>
      </div>

      {contacts.length === 0 ? (
        <div className="directory__empty">
          <p>
            {isFiltering
              ? `No contacts match "${searchTerm}".`
              : "No contacts yet — add your first card."}
          </p>
        </div>
      ) : (
        <div className="contact-grid">
          {contacts.map((contact, index) => (
            <ContactCard
              key={contact.id}
              contact={contact}
              index={index}
              onRemove={onRemoveContact}
            />
          ))}
        </div>
      )}
    </section>
  );
}

function PersonIcon() {
  return (
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
      <circle cx="12" cy="8" r="3.5" stroke="currentColor" strokeWidth="1.8" />
      <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
    </svg>
  );
}

function PlusIcon({ size = 16 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" />
    </svg>
  );
}

function App() {
  const [contacts, setContacts] = useState(STARTER_CONTACTS);
  const [searchTerm, setSearchTerm] = useState("");
  const [showForm, setShowForm] = useState(true);

  const addContact = (newContact) => {
    setContacts((prev) => [
      { ...newContact, id: `${Date.now()}-${Math.random().toString(16).slice(2)}` },
      ...prev,
    ]);
  };

  const removeContact = (id) => {
    setContacts((prev) => prev.filter((contact) => contact.id !== id));
  };

  const companyCount = useMemo(() => {
    const companies = new Set(
      contacts.map((c) => c.company.trim().toLowerCase()).filter(Boolean)
    );
    return companies.size;
  }, [contacts]);

  const filteredContacts = useMemo(() => {
    const term = searchTerm.trim().toLowerCase();
    if (!term) return contacts;
    return contacts.filter((contact) => {
      const name = contact.fullName.toLowerCase();
      const company = contact.company.toLowerCase();
      return name.includes(term) || company.includes(term);
    });
  }, [contacts, searchTerm]);

  return (
    <div className="app">
      <header className="app-header">
        <div className="app-header__brand">
          <div className="app-header__logo">
            <PersonIcon />
          </div>
          <div className="app-header__titles">
            <h1>Contact Cards Manager</h1>
            <p>Digital Business Card Directory &amp; SPA</p>
          </div>
        </div>

        <div className="app-header__right">
          <span className="badge badge--indigo">
            <strong>{contacts.length}</strong> Contact{contacts.length === 1 ? "" : "s"}
          </span>
          <span className="badge badge--violet">
            <strong>{companyCount}</strong> Compan{companyCount === 1 ? "y" : "ies"}
          </span>
          <button
            type="button"
            className="app-header__toggle"
            onClick={() => setShowForm((v) => !v)}
          >
            <PlusIcon />
            {showForm ? "Hide Form" : "Add Contact"}
          </button>
        </div>
      </header>

      <main className={`app-main ${showForm ? "" : "app-main--full"}`}>
        {showForm && <ContactForm onAddContact={addContact} />}
        <ContactList
          contacts={filteredContacts}
          totalCount={contacts.length}
          searchTerm={searchTerm}
          onSearchChange={setSearchTerm}
          onRemoveContact={removeContact}
        />
      </main>

      <footer className="app-footer">
        React Contact Cards Manager &bull; Built with React Hooks (
        <code>useState</code>, <code>useMemo</code>) &amp; Responsive CSS
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
